<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Back in Stock admin</title>
<style nonce="{{ nonce }}">
{% include "_admin_style.html" %}
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); text-align: center; }
  .mark { width: 40px; height: 40px; border-radius: 12px; margin: 0 auto 14px; }
  h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
</style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Admin sign-in required</h1>
    <p>Enter the admin password when your browser asks. Any username works.</p>
    <a class="btn btn-primary" href="/admin">Try again</a>
  </main>
</body>
</html>
